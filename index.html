<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title>WakeLab</title>
</head>
<body>
<header>
<nav class="navbar sm:navbar-expand bg-1 fg-2">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">WakeLab</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Features</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Pricing</a>
          </li>
          <li class="nav-item">
            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
          </li>
        </ul>
      </div>
    </dialog>
  </div>
</nav>

</header>

<main class="d-grid gap-8 m-10 ">

        <h1> WakeLab</h1>


<form class="d-flex flex-column align-items-end gap-2" id="username">
            <div class="d-flex flex-row ">
                <label for="user" class="form-label mb-2"><h4 class="">Nom de l’utilisateur</h4></label>
                <input type="text" class="form-control" id="user" placeholder="Username">
            </div>

            <input type="submit" class="btn" value="Enregistrer">



</form>


                    
    <form class="grid">
        <div class="g-col-9">
            <label for="exampleFormControlInput" class="form-label mb-2"><h4 class="">Rechercher une activité</h4></label>
            <input type="text" class="form-control" id="exampleFormControlInput" placeholder="rechercher...">
        </div>

        <div class="g-col-3">
            <label for="theme" class="form-label">Thème</label>
            <select class="form-control form-control-sm" id="theme">
                <option>Open this select menu</option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
        </div>
        <div class="g-col-1">
            <input type="submit" class="form-control" value="Rechercher">

        </div>
    </form>

        
    
    <div class="row" id="activites">
    
    </div>

<div class="sm:col-12">
    <div class="card">
      <div class="card-body">

        <h4 class="card-title">Ajouter une activité</h4>
        <form class="row g-3">
  <div class="col-md-6">
    <label for="titre" class="form-label">Titre</label>
    <input type="text" class="form-control" id="titre">
  </div>
  <div class="col-md-6">
    <label for="theme" class="form-label">Thème</label>
    <select class="form-control form-control-sm" id="theme">
        <option>Sélectionner un thème</option>
        <option value="1">One</option>
        <option value="2">Two</option>
        <option value="3">Three</option>
    </select>
  </div>
  <div class="col-12">
    <label for="objectifs" class="form-label">Objectifs</label>
    <input type="text" class="form-control" id="objectifs">
  </div>
  <div class="col-12">
    <label for="duree" class="form-label">Durée</label>
    <input type="text" class="form-control" id="duree">
  </div>
  <div class="col-md-6">
    <label for="description" class="form-label">Description</label>
    <input type="text" class="form-control" id="description">
  </div>


  <div class="col-md-2">
    <label for="auteur" class="form-label">Auteur</label>
    <input type="text" class="form-control" id="auteur">
  </div>
  
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Ajouter</button>
  </div>
</form>



      </div>
    </div>
  </div>


</main>



<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
